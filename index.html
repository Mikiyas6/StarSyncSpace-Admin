<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="@/public/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="StarSyncSpace admin — manage rooms, bookings, and availability"
    />
    <title>StarSyncSpace Admin</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem("syncspace-theme");
          var dark = s
            ? s === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- 
  - This empty <div> is the container where our entire React application will live
  - Think of it as the "mounting point" for our React app
  - Everything React renders will be inside this div
-->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
